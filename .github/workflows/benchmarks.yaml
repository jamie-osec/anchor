name: Benchmarks

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'bench/bench'
      - 'bench/Cargo.toml'
      - 'bench/fixture/**'
      - 'bench/src/**'
  pull_request:
    branches:
      - master
      - anchor-next
    paths:
      - '.github/workflows/benchmarks.yaml'
      - 'bench/bench'
      - 'bench/Cargo.toml'
      - 'bench/fixture/**'
      - 'bench/src/**'

permissions:
  contents: read

jobs:
  matrix:
    name: Discover versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
      - id: versions
        name: Read versions
        shell: bash
        run: |
          versions=()
          while IFS= read -r version; do
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            [[ -f "bench/locks/$version.lock" ]] && versions+=("$version")
          done < <(jq -r 'keys[]' bench/results.json)
          printf 'versions=%s\n' "$(jq -cn --args '$ARGS.positional' "${versions[@]}")" >> "$GITHUB_OUTPUT"

  benchmarks:
    needs: matrix
    name: Benchmark ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup/

      - name: Add Solana binaries to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        name: Cache benchmark toolchains
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/solana/
            ~/.local/share/solana/
            ./bench/.cache/
            ./target/
          key: benchmarks-${{ runner.os }}-${{ matrix.version }}-${{ hashFiles('Cargo.lock', 'bench/locks/*.lock') }}

      - run: ./bench/bench "$BENCHMARK_VERSION" --check
        env:
          BENCHMARK_VERSION: ${{ matrix.version }}
