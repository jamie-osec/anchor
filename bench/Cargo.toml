[package]
name = "anchor-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
anchor-lang = { path = "../lang" }
hello-world = { path = "programs/hello-world", features = ["no-entrypoint"] }
litesvm = "0.10.0"
paste = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-keypair = "3.0.1"
solana-message = "3.0.1"
solana-signer = "3.0.0"
solana-transaction = "3.0.1"
