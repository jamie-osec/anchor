[package]
name = "hello-world"
version = "0.1.0"
description = "Hello world program used by anchor-bench"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "hello_world"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
no-log-ix-name = []
custom-heap = []
custom-panic = []
profile = ["anchor-v2-testing/profile"]

[dependencies]
anchor-lang = { package = "anchor-lang-v1", path = "../../../../lang" }

[dev-dependencies]
anchor-v2-testing = { path = "../../../../v2-testing" }
# FIXME: Update liteSVM once this commit exists on a release
litesvm = { version = "0.17.0", git = "https://github.com/LiteSVM/litesvm", rev = "980f39121cda14bc78d8c46489d2d12fb0cc6eae" }
solana-account = "4.5.0"
solana-pubkey = "4.3.0"
